plugins {
  id 'java-library'
}

configurations {
  managerRuntime
}

dependencies {
  api project(":setup")
  managerRuntime project(':manager')
}

tasks.register('license', Copy) {
  from(rootProject.layout.projectDirectory.file("LICENSE.txt"))
  into(layout.buildDirectory.dir("image/manager/app"))
}

tasks.register('installDist', Copy) {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  dependsOn(parent.getTasksByName('installDist', true).findAll {
    // Avoid a circular dependency on this task
    it.project != project
  })
  dependsOn(tasks.named('license'))

  into(layout.buildDirectory)

  from "Dockerfile"

  into("image") {
    from projectDir
    exclude "build.gradle", "Dockerfile", "build", "**/*.mbtiles", "src", "**/*.md", ".gitignore", "**/*.encrypted"
  }

  into("image/manager/extensions") {
    from configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.collect {
      it.file
    }
    // Don't include deps baked into the manager docker image
    exclude configurations.managerRuntime.resolvedConfiguration.resolvedArtifacts.collect {
      it.file.name
    }
    // Don't include any ui packaged JARs (used for dev purposes only)
    exclude {
      (it.file.path.contains(".gradle") || it.file.path.contains(".m2")) && it.file.path.contains("io.openremote.ui")
    }
  }

  into("image/manager/extensions") {
    from project(":manager").layout.buildDirectory.dir("install/manager/deployment/manager/extensions")
  }
}
