plugins {
  id 'base'
}

def generatedUiSources = [':ui:component:model:generateTypeScript', ':ui:component:rest:generateTypeScript']

rootProject.allprojects {
  tasks.matching {
    it.name in ['installDist', 'prepareUi', 'publishUi', 'npmBuild']
  }.configureEach {
    dependsOn generatedUiSources
  }
}

subprojects {
  apply plugin: 'base'

  tasks.named('assemble') {
    dependsOn tasks.matching { it.name in ['npmBuild', 'npmAnalyze'] }
  }

  def npmTestTasks = tasks.matching { it.name == 'npmTest' }
  npmTestTasks.configureEach {
    mustRunAfter generatedUiSources
  }

  tasks.named('check') {
    dependsOn npmTestTasks
    // Standalone test tasks can reuse CI artifacts; check also prepares generated sources.
    dependsOn { npmTestTasks.empty ? [] : generatedUiSources }
  }
}

tasks.register("modelWatch") {
  dependsOn ":ui:component:model:build", ":ui:component:rest:build"
}

tasks.register("knip", Exec) {
  group = 'verification'
  description = 'Checks UI dependencies'
  dependsOn getYarnInstallTask()
  workingDir project.rootDir
  commandLine npmCommand("yarn"), "run", "knip"
}

tasks.register('testKnip', Exec) {
  group = 'verification'
  description = 'Tests Knip configuration with source-only and built workspaces'
  dependsOn getYarnInstallTask()
  workingDir project.rootDir
  commandLine npmCommand("yarn"), "run", "test:knip"
}

tasks.named('check') {
  dependsOn tasks.named('knip'), tasks.named('testKnip')
}
