# Legacy ACM/NLB experiment only; never pass this overlay to or-stack.
service:
  http:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "external"
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"

      service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "arn:aws:acm:eu-west-1:<openremote account id>:certificate/..."
      service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "443,8883"
  mqtts:
    enabled: true

persistence:
  enabled: false

or:
  disableAcme: true
  haproxyConfig: /etc/haproxy/haproxy-edge-terminated-tls.cfg
  httpsPort: 8080
  mqttPort: 1883
