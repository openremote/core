AWSTemplateFormatVersion: "2010-09-09"
Description: Monitoring credentials and direct EC2 read access for one deployment environment

Parameters:
  DeploymentName:
    Type: String
    Description: Stable project identifier, unique within this account
    AllowedPattern: "[a-z0-9]+(-[a-z0-9]+)*"
    MaxLength: 48

  EnvironmentName:
    Type: String
    Description: Environment identifier, for example staging or production
    AllowedPattern: "[a-z0-9]+(-[a-z0-9]+)*"
    MaxLength: 32

  EC2RoleName:
    Type: String
    Description: Existing EC2 instance role name in this account (root IAM path); not the GitHub role
    AllowedPattern: "[A-Za-z0-9+=,.@_-]+"
    MaxLength: 64

Resources:
  MonitoringCredentials:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub "openremote/monitoring/${DeploymentName}/${EnvironmentName}/credentials"
      Description: !Sub "Loki and Prometheus credentials for ${DeploymentName}/${EnvironmentName}; Tempo reuses Loki"
      # Empty until an authorized operator supplies the existing backend passwords.
      # No SecretString, GenerateSecretString or password parameters in this template.
      # The default same-account aws/secretsmanager key encrypts supplied values.
      Tags:
        - Key: Component
          Value: monitoring
        - Key: Deployment
          Value: !Ref DeploymentName
        - Key: Environment
          Value: !Ref EnvironmentName

  MonitoringCredentialsReadPolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref MonitoringCredentials
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowInstanceCredentialRead
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${EC2RoleName}"
            Action: secretsmanager:GetSecretValue
            Resource: !Ref MonitoringCredentials
      # Deleting this stack retains the secret but removes this read grant.
      # No IAM role, trust policy or CfCT-owned inline policy is modified.

Outputs:
  MonitoringSecretArn:
    Description: Full secret ARN for the non-secret deployment settings; not its value
    Value: !Ref MonitoringCredentials
