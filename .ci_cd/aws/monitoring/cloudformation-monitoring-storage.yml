AWSTemplateFormatVersion: "2010-09-09"
Description: Private release artifacts for EC2 monitoring, shared by environments in one account

# Provision once per customer account and region, separately from application backups.
Resources:
  MonitoringArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "openremote-monitoring-${AWS::AccountId}-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      Tags:
        - Key: Component
          Value: monitoring
        - Key: Purpose
          Value: release-artifacts

  MonitoringArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Bucket: !Ref MonitoringArtifacts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt MonitoringArtifacts.Arn
              - !Sub "${MonitoringArtifacts.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  ArtifactBucketName:
    Description: Shared bucket for environment-specific monitoring release prefixes
    Value: !Ref MonitoringArtifacts
  ArtifactBucketArn:
    Description: Bucket ARN for separately reviewed workflow and instance permissions
    Value: !GetAtt MonitoringArtifacts.Arn
