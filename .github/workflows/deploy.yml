# ---------------------------------------------------------------------------------------------------------------------
# This environment workflow runs for manual deployments of this repo, it handles:
#
# - Building and deploying the selected commit (see deployment.yml for how deployments work)
#
# MANUAL TRIGGER
#
# The following inputs are available, they override secrets with the same name but not values from the '.ci_cd/env'
# files:
#
# - ENVIRONMENT           - Which environment to deploy (equivalent to deploy/environment in '.ci_cd/ci_cd.json')
# - MANAGER_TAG           - Which manager docker tag to deploy (equivalent to deploy/managerTag in '.ci_cd/ci_cd.json'),
#                           leave empty to build a manager image from the checked out commit
# - CLEAN_INSTALL         - Should the .ci_cd/host_init/clean.sh script be run during deployment (warning this will delete
#                           assets, rules, etc.)
# - COMMIT                - Which branch/SHA should be checked out for the deployment (defaults to trigger commit)
# - OR_HOSTNAME           - FQDN of host to deploy to (e.g. demo.openremote.app)
# - OR_ADMIN_PASSWORD     - The admin password to set for clean installs
#
# When triggered on a tag the 'workflow_dispatch' deploy entry in '.ci_cd/ci_cd.json' is used instead of ENVIRONMENT
# and MANAGER_TAG.
#
# Custom projects use custom-deploy.yml instead.
# ---------------------------------------------------------------------------------------------------------------------

name: Deploy

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Environment to use (if any)"
      MANAGER_TAG:
        description: "Manager docker tag to pull"
      CLEAN_INSTALL:
        description: "Delete data before starting"
        type: boolean
      COMMIT:
        description: "Repo branch or commit SHA to checkout. WARNING: Picking an older commit may cause pipeline failures if build/deploy steps are missing or incompatible."
      OR_HOSTNAME:
        description: "Host to deploy to (e.g. demo.openremote.app)"
      OR_ADMIN_PASSWORD:
        description: "Admin password override"

  workflow_call:
    inputs:
      INPUTS:
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  is-core-repo:
    name: Is core repository
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.is_core_repo.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check if core repo
        id: is_core_repo
        uses: openremote/core/.github/actions/check-if-core-repo@357f1387fbc99e7a59752a62064f0bdade57612d

  install-dist:
    name: Build
    needs: is-core-repo
    if: ${{ needs.is-core-repo.outputs.value == 'true' }}
    uses: "./.github/workflows/install-dist.yml"
    with:
      COMMIT: ${{ inputs.COMMIT }}

  deployment:
    name: Deployment
    needs: install-dist
    if: always() && !cancelled() && (needs.install-dist.result == 'success' || needs.install-dist.result == 'skipped')
    uses: "./.github/workflows/deployment.yml"
    with:
      INPUTS: ${{ toJSON(inputs) }}
      COMMIT: ${{ inputs.COMMIT }}
    secrets: inherit
