name: UI Check Outdated Translations
on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        description: Skip condition to allow branch protection checks to pass
        default: false

jobs:
  ui-check-outdated-translations:
    name: Check for outdated translations
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"
      - name: Check for outdated translations
        timeout-minutes: 20
        run: ./gradlew :ui:app:shared:checkTranslations --no-parallel
