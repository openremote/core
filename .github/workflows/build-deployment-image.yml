# Currently only used to test if it builds before merging to main
name: Build deployment image

on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        description: Skip condition to allow branch protection checks to pass
        default: false
      tag:
        type: string
        required: true

jobs:
  build-deployment-image:
    name: Deployment image
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: 21
          cache: "gradle"

      - name: Check deployment build.gradle
        id: check_deployment_gradle
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          fail: true # Deployment must have a build.gradle file to prepare the deployment files in the deployment/build dir
          files: "deployment/build.gradle"

      - name: Check deployment dockerfile
        id: check_deployment_dockerfile
        uses: andstor/file-existence-action@558493d6c74bf472d87c84eab196434afc2fa029 # v3.1.0
        with:
          fail: true
          files: "deployment/Dockerfile"

      - name: Build deployment
        shell: bash
        run: ./gradlew -p deployment installDist # TODO: optimize the task graph

      - name: Install QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/amd64,linux/aarch64
      - name: Install Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build deployment image
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deployment/build
          platforms: linux/amd64,linux/aarch64
          load: false
          push: false
          tags: openremote/deployment:${{ inputs.tag }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
