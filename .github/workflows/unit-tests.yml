name: Unit Tests
on:
  workflow_call:
    inputs:
      skip:
        type: boolean
        description: Skip condition to allow branch protection checks to pass
        default: false

jobs:
  unit-tests:
    name: Unit Tests
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 and Gradle cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Check if core repo
        id: is_core_repo
        uses: openremote/core/.github/actions/check-if-core-repo@357f1387fbc99e7a59752a62064f0bdade57612d

      - name: Run unit tests
        timeout-minutes: 20
        run: |
          if [ "${{ steps.is_core_repo.outputs.value }}" = "true" ]; then
            ./gradlew test -x :test:test -x npmTest unitTestReport
          else
            ./gradlew test -x :test:test
          fi

      - name: Archive unit test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: or-unit-test-results
          path: build/reports/tests/test/aggregated-results/

      - name: Archive JaCoCo coverage outputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: or-unit-test-outputs
          path: |
            **/build/classes/java/main/**
            **/build/classes/java/test/**
            **/build/jacoco/*.exec
            **/build/reports/tests/test/**
            **/build/test-results/test/**
