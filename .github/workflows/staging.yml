# ---------------------------------------------------------------------------------------------------------------------
# This environment workflow runs for commits pushed to main and releases of this repo, it handles:
#
# - Linting, building and testing
# - Publishing the manager image, its tags are configured in '.ci_cd/ci_cd.json'
# - Publishing the packages
# - Updating dependent repositories to the new version
#
# Releases are created by release.yml, which pushes the release tag and then manually triggers this workflow on that
# tag, so the 'release' section of '.ci_cd/ci_cd.json' applies (see .ci_cd/README.md for more details).
#
# This workflow does not deploy, use deploy.yml for manual deployments. Custom projects use custom-staging.yml instead.
# ---------------------------------------------------------------------------------------------------------------------

name: Staging

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect whether code changed
    runs-on: ubuntu-latest
    outputs:
      # Code changes
      # See https://github.com/tj-actions/changed-files/tree/2bb135777322059ee3a3c9239999b159ff49febc#outputs-
      any_modified: ${{ steps.changed-files.outputs.backend_any_modified == 'true' || steps.changed-files.outputs.ui_any_modified == 'true' }}
      backend_any_modified: ${{ steps.changed-files.outputs.backend_any_modified }}
      backend_spotless_any_modified: ${{ steps.changed-files.outputs.backend_spotless_any_modified }}
      ui_any_modified: ${{ steps.changed-files.outputs.ui_any_modified }}
      ui_spotless_any_modified: ${{ steps.changed-files.outputs.ui_spotless_any_modified }}
      # Version details
      version: ${{ steps.get-version-details.outputs.version }}
      version_with_qualifier: ${{ steps.get-version-details.outputs.version_with_qualifier }}
      is_release: ${{ steps.get-version-details.outputs.is_release }}
      # Processed ci_cd.json outputs
      dockerTags: ${{ steps.ci-cd-output.outputs.dockerTags }}
      npmTag: ${{ steps.ci-cd-output.outputs.npmTag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2 # Must be 2 for push events to compare to previous commit

      - name: Detect changes
        id: changed-files
        if: github.ref_type != 'tag'
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files_yaml: |
            ui:
              - '.yarn'
              - 'ui/**'
              - '!**/*.md'
              - '!**/*.yml'
              - '.yarnrc.yml'
              - 'package.json'
              - 'yarn.lock'
            backend:
              - '!.ci_cd/**'
              - '!.yarn'
              - '!deployment/**'
              - '!ui/**'
              - '!**/*.md'
              - '!**/*.yml'
              - '!.yarnrc.yml'
              - '!package.json'
              - '!yarn.lock'
            # Sources and configuration that spotlessBackendCheck reads
            backend_spotless:
              - '**/*.{gradle,groovy,java,md,tpl,xml,xsd,yaml,yml}'
              - '!ui/**'
              - 'package.json'
              - 'tools/spotless/**'
              - 'ui/.prettierignore'
              - 'ui/.prettierrc.json'
            # Sources and configuration that spotlessUiCheck reads
            ui_spotless:
              - '*.{gradle,md}'
              - 'package.json'
              - 'tools/spotless/**'
              - 'ui/**/*.{cjs,css,cts,gradle,html,js,json,jsonc,jsx,md,mdx,mjs,mts,ts,tsx}'
              - 'ui/.prettierignore'

      - name: Get version details
        id: get-version-details
        uses: openremote/core/.github/actions/get-version-details@accaf8ed2cab816cb081ae57be6bebed93c049f0

      - name: Check if core repo
        id: is_core_repo
        uses: openremote/core/.github/actions/check-if-core-repo@357f1387fbc99e7a59752a62064f0bdade57612d

      - name: Process ci_cd.json file
        id: ci-cd-output
        uses: openremote/core/.github/actions/process-cicd-json@357f1387fbc99e7a59752a62064f0bdade57612d
        with:
          IS_CORE_REPO: ${{ steps.is_core_repo.outputs.value }} # Shouldn't be needed in this context
          MANAGER_VERSION: ${{ steps.is_core_repo.outputs.version }}
          IS_RELEASE: ${{ steps.get-version-details.outputs.is_release }}
          VERSION: ${{ steps.get-version-details.outputs.version }}

  check-spotless:
    name: Lint
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/check-spotless.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.backend_spotless_any_modified != 'true' }}

  ui-check-dependencies:
    name: Lint
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/ui-check-dependencies.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.ui_any_modified != 'true' }}

  ui-check-spotless:
    name: Lint
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/ui-check-spotless.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.ui_spotless_any_modified != 'true' }}

  ui-check-outdated-translations:
    name: Lint
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/ui-check-outdated-translations.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.backend_any_modified != 'true' }}

  install-browsers:
    name: Build
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/install-browsers.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.any_modified != 'true' }}

  install-dist:
    name: Build
    needs: detect-changes
    uses: "./.github/workflows/install-dist.yml"
    with:
      VERSION_WITH_QUALIFIER: ${{ needs.detect-changes.outputs.version_with_qualifier }}

  unit-tests:
    name: Test
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/unit-tests.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.backend_any_modified != 'true' }}

  integration-tests:
    name: Test
    needs: detect-changes
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/integration-tests.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.backend_any_modified != 'true' }}

  code-coverage:
    name: Test
    needs: [detect-changes, unit-tests, integration-tests]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/code-coverage.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.backend_any_modified != 'true' }}

  ui-component-tests:
    name: Test
    needs: [detect-changes, install-dist, install-browsers]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/ui-component-tests.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.ui_any_modified != 'true' }}

  ui-app-tests:
    name: Test
    needs: [detect-changes, install-dist, install-browsers]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/ui-app-tests.yml"
    with:
      skip: ${{ needs.detect-changes.outputs.any_modified != 'true' }}

  build-manager-image:
    name: Build
    needs:
      [
        detect-changes,
        install-dist,
        unit-tests,
        integration-tests,
        ui-check-outdated-translations,
        ui-component-tests,
        ui-app-tests,
      ]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/build-manager-image.yml"
    with:
      tags: ${{ needs.detect-changes.outputs.dockerTags }}
    secrets:
      DOCKERHUB_USER: ${{ secrets._TEMP_DOCKERHUB_USER }}
      DOCKERHUB_PASSWORD: ${{ secrets._TEMP_DOCKERHUB_PASSWORD }}

  # build-deployment-image: # TODO: enable when we have private registries for custom projects
  #   name: Build
  #   needs: [install-dist]
  #   uses: "./.github/workflows/build-deployment-image.yml"

  publish-maven:
    name: Publish
    needs:
      [
        detect-changes,
        install-dist,
        unit-tests,
        integration-tests,
        ui-check-outdated-translations,
        ui-component-tests,
        ui-app-tests,
      ]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/publish-maven.yml"
    secrets:
      MAVEN_SIGNING_PASSWORD: ${{ secrets._TEMP_MAVEN_SIGNING_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets._TEMP_MAVEN_SIGNING_KEY }}
      MAVEN_USERNAME: ${{ secrets._TEMP_MAVEN_USERNAME }}
      MAVEN_PASSWORD: ${{ secrets._TEMP_MAVEN_PASSWORD }}

  publish-npm:
    name: Publish
    needs:
      [
        detect-changes,
        install-dist,
        unit-tests,
        integration-tests,
        ui-check-outdated-translations,
        ui-component-tests,
        ui-app-tests,
      ]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/publish-npm.yml"
    with:
      tag: ${{ needs.install-dist.outputs.npmTag }}
    secrets:
      NPM_AUTH_TOKEN: ${{ secrets._TEMP_NPM_AUTH_TOKEN }}

  extensions:
    name: Extensions
    needs: [detect-changes, build-manager-image, publish-maven]
    if: ${{ !failure() && !cancelled() }}
    uses: "./.github/workflows/extensions.yml"
    with:
      version: ${{ needs.detect-changes.outputs.version_with_qualifier }}
      is_release: ${{ needs.detect-changes.outputs.is_release }}
    secrets:
      CI_AUTOMATION_APP_CLIENT_ID: ${{ secrets._TEMP_CI_AUTOMATION_APP_CLIENT_ID }}
      CI_AUTOMATION_APP_PRIVATE_KEY: ${{ secrets._TEMP_CI_AUTOMATION_APP_PRIVATE_KEY }}
