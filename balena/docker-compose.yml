# Balena CLI requires this version, see: https://github.com/balena-io/balena-cli/issues/2314
version: "2.4"

volumes:
  proxy-data:
  postgresql-data:
  manager-data:

services:
  proxy:
    image: openremote/proxy:latest
    restart: always
    depends_on:
      - manager
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      - proxy-data:/deployment

  postgresql:
    image: openremote/postgresql:latest-slim
    restart: always
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - manager-data:/storage

  keycloak:
    image: openremote/keycloak:latest
    restart: always
    depends_on:
      - postgresql
    environment:
      KC_HOSTNAME:
      KC_HOSTNAME_STRICT: false

  manager:
    image: openremote-manager
    build:
      context: .
    restart: always
    depends_on:
      - keycloak
      - postgresql
    volumes:
      - manager-data:/storage
    environment:
      OR_WEBSERVER_ALLOWED_ORIGINS: "*"
      OR_GATEWAY_TUNNEL_SSH_KEY_FILE: /deployment/sish/client/client
      OR_GATEWAY_TUNNEL_AUTO_CLOSE_MINUTES: 20
      OR_KEYCLOAK_DISABLE_ISSUER_VALIDATION: true
