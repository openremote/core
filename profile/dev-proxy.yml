# OpenRemote v3
#
# Profile for running the reverse proxy on https://127.0.0.1/ with the manager backend mapped to the host machine on
# 127.0.0.1:8080 and the keycloak backend mapped to the host machine on 127.0.0.1:8081
#
# Please see deploy.yml for configuration details for each service.
#
volumes:
  postgresql-data:
  proxy-data:

services:
  proxy:
    extends:
      file: deploy.yml
      service: proxy
    environment:
      MANAGER_HOST: ${MANAGER_HOST:-host.docker.internal}
      # Uncomment to use sish in development
      #SISH_HOST: sish
      #SISH_PORT: 8090
    volumes:
      - proxy-data:/deployment

  keycloak:
    extends:
      file: deploy.yml
      service: keycloak
    ports:
      - "8081:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    # OR_MANAGER_URL is not set: the manager is expected on the same base URL as keycloak.

  postgresql:
    extends:
      file: deploy.yml
      service: postgresql
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

